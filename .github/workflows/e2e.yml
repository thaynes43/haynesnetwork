name: e2e

# GATE for the book pipeline (issue #742, ADR-100; amends ADR-009 C-06 / ADR-010 C-07), trimmed by ADR-102.
#
# The required status-check context is `e2e-gate`. It ALWAYS reports on a pull request:
#   - a PR that touches a pipeline path (scripts/e2e-gate-paths.sh), or is the release-please PR, runs the suite
#     as `e2e / e2e` and `e2e-gate` mirrors it: red suite = red gate = nothing merges, nothing releases;
#   - any other PR passes `e2e-gate` in seconds and runs no suite. The advisory run is opt-in: label the PR
#     `run-e2e` (e2e-advisory.yml).
# A push to main runs nothing (ADR-102): branch protection is strict, so main's tree is the tree the PR tested, and
# the release PR runs the suite on main's tree before any release. `workflow_dispatch` runs the suite on any branch.
# Do NOT rename the `e2e-gate` job without updating branch protection (docs/ops/004-deploy-runbook.md section 6).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's files
    outputs:
      pipeline: ${{ steps.decide.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the pipeline-path rules against their examples
        run: bash scripts/e2e-gate-paths.sh --self-test
      - name: Decide whether this change is gated
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            echo "Run by hand: the suite runs."
            exit 0
          fi
          # The release PR gates the release itself: a red suite must hold the tag, whatever the PR's own files are.
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            echo "Release PR: e2e gates the release."
            exit 0
          fi
          # The files API returns at most 3000 files; past that the list is partial, so gate.
          if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGED_FILES changed files, more than the files API lists: e2e gates this PR."
            exit 0
          fi
          # Renames list both names, so moving a file OUT of a pipeline path still counts.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed paths"
          if matched=$(bash scripts/e2e-gate-paths.sh < "$RUNNER_TEMP/changed.txt"); then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            echo "Pipeline paths changed, e2e gates this PR:"
            echo "$matched"
          else
            echo "pipeline=false" >> "$GITHUB_OUTPUT"
            echo "No pipeline path changed: e2e-gate passes at once (label the PR run-e2e for an advisory run)."
          fi

  # The suite, GATING (pipeline PR, release PR) or run by hand (workflow_dispatch).
  e2e:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    uses: ./.github/workflows/e2e-suite.yml

  # THE REQUIRED CONTEXT. Fails closed: anything other than "not gated" or "suite green" is red.
  e2e-gate:
    needs: [changes, e2e]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror the suite when the PR is gated, pass when it is not
        env:
          CHANGES: ${{ needs.changes.result }}
          PIPELINE: ${{ needs.changes.outputs.pipeline }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES pipeline=$PIPELINE e2e=$E2E"
          if [ "$CHANGES" != success ]; then
            echo "::error::Could not decide whether this PR is gated (changes job: $CHANGES)."
            exit 1
          fi
          if [ "$PIPELINE" = true ]; then
            if [ "$E2E" = success ]; then
              echo "Gated PR and the suite is green."
              exit 0
            fi
            echo "::error::This PR touches the book pipeline (or is the release PR) and the e2e suite is $E2E."
            exit 1
          fi
          echo "Not a gated PR: passing at once."
