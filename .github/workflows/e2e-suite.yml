name: e2e-suite

# The Playwright suite as a reusable workflow, so e2e.yml can run it as the GATING job (a PR that touches the book
# pipeline, the release-please PR, or by hand) and e2e-advisory.yml as the opt-in ADVISORY job (a PR labelled
# `run-e2e`) without copying the steps. Nothing here decides whether a result blocks a merge; e2e.yml's `e2e-gate`
# does (ADR-100, ADR-102).
on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only (the suite's single project); --with-deps pulls the system
      # libraries the runner image may lack (CI-only — locally plain install).
      - run: pnpm --filter web exec playwright install chromium --with-deps
      # globalSetup boots embedded Postgres 16 + the stub OIDC + `next dev`
      # (ADR-010 — no Docker/Testcontainers, no live Authentik).
      - run: pnpm --filter web e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
