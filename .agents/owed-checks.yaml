# Owed checks: the post-deploy checks a deploy record leaves for later (DESIGN-053).
#
# One row per check. A deploy record ADDS ROWS HERE instead of writing lettered "(x)" items into HANDOFF prose; a session
# that runs a check RECORDS THE RESULT HERE (status + a dated evidence line) in a docs PR merged to main. Ids are stable
# and never reused: take the next OC-NNN.
#
#   id, title, opened        OC-NNN; what is checked; the day the check was written
#   legacy                   the HANDOFF letter the check had before this file, if any
#   after, not_before        the event the check follows, in words; and the UTC instant its automated checks start
#   due                      UTC instant the result must be recorded by. A pending row past it is OVERDUE: the GitHub
#                            Action opens or updates the "Owed checks overdue" issue, and Loki fires OwedCheckOverdue.
#                            A check waiting on an event that has not happened gets a review date; moving it is an
#                            evidence line that says why.
#   owner                    the session or agent kind that runs it
#   status                   pending | passed | failed | waived (failed names its follow-up; non-pending needs evidence)
#   check                    the exact check by hand: query or command and the expected result
#   auto, auto_covers        read-only checks the in-cluster runner (CronJob owed-checks, namespace downloads) runs every
#                            hour once not_before has passed; `all` if they cover the whole check, `part` if not.
#                            source: app-db (Postgres replica, read-only session) | ll-db (LazyLibrarian SQLite,
#                            mode=ro) | loki | prometheus (instant metric queries; `$SINCE` = the range since not_before,
#                            or since the check's own `since`; `at` pins the evaluation instant). expect: rows /
#                            min_rows / max_rows / eq / min / max / paths_exist. mismatch: fail (a defect) | wait (not
#                            happened yet). Results are Loki lines `owed_check_result`; a fail fires OwedCheckFailing.
#   evidence, links          dated results, newest last; prs / issues / the HANDOFF block / the follow-up
#
# History before 2026-10-06 (checks (a), (c), (f), (g) and earlier) stays in HANDOFF.
version: 1
checks:
  - id: OC-001
    legacy: (b)
    title: The first janitor failed-download retry with Sonarr and Radarr Redownload off
    opened: 2026-10-03
    after: the first natural Sonarr or Radarr download failure after Redownload went off (2026-10-03 21:25:26Z)
    not_before: 2026-10-03T21:26:00Z
    due: 2026-10-13T12:00:00Z
    owner: haynesnetwork coordinator (janitor ladder, PLAN-065)
    status: pending
    check: |
      Loki {namespace="frontend", app="haynesnetwork"} |= "queue-cleanup failed downloads": the first line after a
      natural failure shows "arrRetries":false and `searched` no more than `failures`. The retry row (OPS-018 section 3
      SQL) is blocklisted_searched / done, at most one per title per run. Record it in PLAN-065's ladder log.
      By hand: `searched` against `failures` on the line, and the ladder log entry.
    auto_covers: part
    auto:
      - name: a retry ran with Redownload off
        source: loki
        query: sum(count_over_time({namespace="frontend", container="main", pod=~"haynesnetwork-sync-queue-cleanup-.*"} |= "queue-cleanup failed downloads" |= "\"arrRetries\":false" [$SINCE]))
        expect: {min: 1}
        mismatch: wait
      - name: a retry searched and finished
        source: app-db
        query: |
          select count(*) as n from arr_queue_cleanup_actions
          where queue_item_id is null and instance in ('sonarr', 'radarr')
            and action = 'blocklisted_searched' and outcome = 'done' and created_at > '2026-10-03T21:26:00Z'
        expect: {min: 1}
        mismatch: wait
      - name: at most one retry per title per run
        source: app-db
        query: |
          select instance, target_id, date_trunc('hour', created_at) as run_hour, count(*) as n
          from arr_queue_cleanup_actions
          where queue_item_id is null and instance in ('sonarr', 'radarr')
            and action = 'blocklisted_searched' and created_at > '2026-10-03T21:26:00Z'
          group by 1, 2, 3 having count(*) > 1
        expect: {rows: 0}
    evidence:
      - "2026-10-04 23:55Z still waiting: the only line in 48 h is the 2026-10-03 21:25Z Radarr one, written before Redownload went off."
    links:
      handoff: 2026-10-03 (evening) and 2026-10-03 (late) blocks
      prs: [haynesnetwork#647]

